<!--
  Mimic the extension's base typography in stories. Production injects
  styles.css into a shadow root whose host (.content_script) sets the font
  stack; stories render OverlayApp directly in the canvas, so the stack is
  applied to the canvas body here instead. Inter is loaded from Google Fonts
  (the extension does not bundle it) so the intended first choice resolves;
  the rest of the stack mirrors src/content/styles.css.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
  rel="stylesheet"
/>
<style>
  body {
    font-family:
      "Inter Variable",
      "Inter",
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      "Helvetica Neue",
      Arial,
      "Noto Sans",
      sans-serif;
  }
</style>
